# Serves addin/ at https://jonashertner.github.io/citecheck/ together with the
# current cite list. The list is not kept in git: build/publish_cite_index.py
# uploads it nightly to the HuggingFace mirror (artifacts/cite_index/), and this
# workflow fetches it, verifies the SHA-256 in index.json, and deploys. It runs
# on push, every two hours (the upload lands between 17:30 and 23:35 UTC,
# depending on when the pipeline ends), and by hand.
name: pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '45 */2 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify the cite list
        run: |
          base=https://huggingface.co/datasets/voilaj/swiss-caselaw/resolve/main/artifacts/cite_index
          mkdir -p addin/index && cd addin/index
          curl -fsSL "$base/index.json" -o index.json
          file=$(python3 -c "import json; print(json.load(open('index.json'))['file'])")
          want=$(python3 -c "import json; print(json.load(open('index.json'))['sha256'])")
          curl -fsSL "$base/$file" -o "$file"
          echo "$want  $file" | sha256sum --check
          python3 -c "import json; m=json.load(open('index.json')); print(m['file'], m['decisions'], 'decisions, generated', m['generated'])"
      - name: Manifest for this host
        run: python3 build/make_manifest.py --base-url https://jonashertner.github.io/citecheck/ --out addin/manifest.xml
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: addin
      - id: deployment
        uses: actions/deploy-pages@v4
