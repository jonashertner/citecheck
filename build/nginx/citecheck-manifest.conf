# Serves the citecheck manifest from mcp.opencaselaw.ch so that downloads are
# counted in nginx's access log (GitHub Pages keeps none). The add-in itself
# stays on jonashertner.github.io; the manifest only names that address.
#
# Install on the OpenCaseLaw host, inside the mcp.opencaselaw.ch server block:
#   mkdir -p /opt/citecheck/manifest && cp build/nginx/manifest.xml /opt/citecheck/manifest/
#   include this file next to the other locations, then nginx -t && systemctl reload nginx
# Count: build/nginx/count_downloads.sh
location = /citecheck/manifest.xml {
    alias /opt/citecheck/manifest/manifest.xml;
    default_type application/xml;
    charset utf-8;
    add_header Content-Disposition 'attachment; filename="citecheck-manifest.xml"';
    add_header Cache-Control "no-cache";
    add_header Access-Control-Allow-Origin "*";
}
