<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <!--
    The browser enforces this policy; it is the add-in's data-flow guarantee.
    connect-src 'self': scripts can reach only the origin that serves this page
    (the add-in's own files and the cite list under ./index/). Images, fonts and
    frames from elsewhere, inline scripts, eval and form posts are all refused.
    The one foreign origin is Microsoft's office.js, which every Office add-in
    loads; it is a script load, and the policy applies to that script as well.
  -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self' https://appsforoffice.microsoft.com; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zitatprüfung</title>
  <link rel="stylesheet" href="css/pane.css">
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="pane">
    <header class="head">
      <div class="head-row">
        <h1 class="sr-only" id="title">Zitatprüfung</h1>
        <div class="modes" id="modes" role="tablist">
          <button type="button" class="mode-tab" id="mode-cites" role="tab" aria-controls="cite-mode">Zitate</button>
          <button type="button" class="mode-tab" id="mode-anon" role="tab" aria-controls="anon-mode">Anonymisierung</button>
        </div>
        <div class="langs" id="langs" role="group" aria-label="Sprache"></div>
        <select class="lang-select" id="lang-select" aria-label="Sprache"></select>
      </div>
      <div id="cite-head">
      <p class="list-line" id="list-line" aria-live="polite"></p>
      <p class="list-note" id="list-note" hidden></p>
      <div class="progress" id="progress" hidden>
        <div class="bar"><span id="bar"></span></div>
        <p id="progress-text"></p>
      </div>
      <div class="actions">
        <button type="button" class="primary" id="check" disabled>Entwurf prüfen</button>
        <button type="button" class="quiet" id="update" disabled>Liste aktualisieren</button>
      </div>
      </div>
      <div id="anon-head" hidden>
        <p class="purpose" id="a-purpose"></p>
        <p class="scope" id="a-scope" hidden></p>
        <details class="preview" id="a-preview-box" open>
          <summary id="a-preview-label"></summary>
          <span id="a-preview"></span> <a id="a-feedback" href="https://github.com/jonashertner/citecheck/issues" target="_blank" rel="noopener noreferrer"></a>
        </details>
        <div class="actions">
          <button type="button" class="primary" id="a-check" disabled></button>
        </div>
      </div>
    </header>

    <div class="mode" id="cite-mode" role="tabpanel" aria-labelledby="mode-cites">

    <section class="paste" id="paste" hidden>
      <div class="drop" id="drop">
        <button type="button" class="quiet" id="pick"></button>
        <input type="file" id="file" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden>
        <p id="file-line"></p>
      </div>
      <label for="paste-text" id="paste-label">Text des Entwurfs</label>
      <textarea id="paste-text" rows="3" spellcheck="false"></textarea>
      <p id="paste-hint"></p>
    </section>

    <p class="alert" id="alert" role="alert" hidden></p>

    <section class="summary" id="summary" hidden>
      <p class="verdict" id="verdict"></p>
      <div class="filters" id="filters" role="group"></div>
    </section>

    <main class="results" id="results" hidden>
      <div class="margin" id="margin" aria-hidden="true"></div>
      <ol class="list" id="list"></ol>
    </main>

    <section class="empty" id="empty">
      <h2 id="empty-title"></h2>
      <p id="empty-body"></p>
    </section>
    </div>

    <div class="mode" id="anon-mode" role="tabpanel" aria-labelledby="mode-anon" hidden>
      <section class="paste" id="a-file" hidden>
        <div class="drop" id="a-drop">
          <button type="button" class="quiet" id="a-pick"></button>
          <input type="file" id="a-input" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden>
          <p id="a-file-line"></p>
        </div>
      </section>
      <p class="alert" id="a-alert" role="alert" hidden></p>
      <section class="summary" id="a-summary" hidden>
        <p class="verdict" id="a-verdict" aria-live="polite"></p>
        <p class="tally" id="a-tally"></p>
        <p class="explained"><span id="a-explained"></span> <button type="button" class="link" id="a-why-open" aria-expanded="false" aria-controls="a-why"></button></p>
        <dl class="why" id="a-why" hidden></dl>
      </section>
      <main class="results a-results" id="a-results" hidden>
        <div class="margin" id="a-margin" aria-hidden="true"></div>
        <div class="a-lists">
          <div class="a-group" id="a-text"></div>
          <div class="a-group" id="a-file-group"></div>
          <p class="limit" id="a-limit"></p>
        </div>
      </main>
      <section class="empty" id="a-empty">
        <h2 id="a-empty-title"></h2>
        <p id="a-empty-body"></p>
      </section>
      <section class="copybar" id="a-copybar" hidden>
        <div class="copy-row">
          <label for="a-style" id="a-style-label"></label>
          <select id="a-style"></select>
        </div>
        <button type="button" class="primary" id="a-copy"></button>
        <details class="removed">
          <summary id="a-removed-title"></summary>
          <p class="copy-note" id="a-copy-note"></p>
        </details>
        <p class="copy-result" id="a-copy-result" role="status" hidden></p>
      </section>
    </div>

    <footer class="foot">
      <p><span id="privacy"></span> <button type="button" class="link" id="about-open"></button></p>
    </footer>
  </div>

  <dialog class="about" id="about" aria-labelledby="about-title">
    <h2 id="about-title"></h2>
    <p id="about-1"></p>
    <p id="about-2"></p>
    <p id="about-3"></p>
    <p id="about-4"></p>
    <dl>
      <dt id="about-list-label"></dt><dd id="about-list"></dd>
      <dt id="about-sha-label"></dt><dd id="about-sha" class="hash"></dd>
      <dt id="about-timings-label"></dt><dd id="about-timings"></dd>
    </dl>
    <p><a id="about-source" href="https://github.com/jonashertner/citecheck" target="_blank" rel="noopener noreferrer"></a></p>
    <button type="button" class="quiet" id="about-close"></button>
  </dialog>
</body>
</html>
